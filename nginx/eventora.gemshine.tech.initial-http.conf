# ==============================================================================
# Step 1: Initial HTTP Config (Use this BEFORE running certbot)
# Place in: /etc/nginx/sites-available/eventora.gemshine.tech
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name eventora.gemshine.tech;

    root /var/www/event-management/dist;
    index index.html;

    # Proxy API to Node.js on Port 5023
    location /api/ {
        proxy_pass http://127.0.0.1:5023;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Run certbot to automatically convert this to HTTPS:
# sudo certbot --nginx -d eventora.gemshine.tech
