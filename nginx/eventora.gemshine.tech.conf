# ==============================================================================
# Nginx Configuration for: eventora.gemshine.tech
# Place this file in: /etc/nginx/sites-available/eventora.gemshine.tech
# Symlink to: /etc/nginx/sites-enabled/eventora.gemshine.tech
# ==============================================================================

# 1. HTTP Server - Redirects all HTTP traffic to HTTPS (Certbot auto-configures this)
server {
    listen 80;
    listen [::]:80;
    server_name eventora.gemshine.tech;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Active once certbot generates SSL certificates)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eventora.gemshine.tech;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/eventora.gemshine.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventora.gemshine.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend Static Files (Built Vite App)
    # Adjust this path if your project is deployed in another directory (e.g. /home/ubuntu/event-management/dist)
    root /var/www/eventora/dist;
    index index.html;

    # Route /api requests to Node.js backend on Port 5023
    location /api/ {
        proxy_pass http://127.0.0.1:5023;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Assets Caching (1 year cache for hashed assets)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA Routing: Fallback to index.html for React Routes (#events, #gallery, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
